kind = "web"
previewPath = "/"
title = "Ram Krishna Homeo Hall and Clinic"
description = "A modern multilingual website for Ram Krishna Homeo Hall and Clinic in Mashrakh, helping local customers discover homeopathic medicines, consultation, wellness products, availability checking, and direct contact options."
version = "1.0.0"
id = "artifacts/ram-krishna-homeo-hall"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19480

[services.development]
run = "pnpm --filter @workspace/ram-krishna-homeo-hall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ram-krishna-homeo-hall", "run", "build" ]
serve = "static"
publicDir = "artifacts/ram-krishna-homeo-hall/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19480"
BASE_PATH = "/"
